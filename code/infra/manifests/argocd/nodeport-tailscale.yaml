# =============================================================================
# Argo CD — NodePort Service (Cách 3: Tailscale VPN direct access)
# =============================================================================
#
# Truy cập Argo CD UI qua Tailscale IP (chỉ thiết bị trong Tailscale network)
#
# Luồng:
#   Workstation (Tailscale) → Worker Node Tailscale IP:30443 → argocd-server
#
# Bảo mật:
#   1. Tailscale — WireGuard encrypted, identity-based access
#   2. NodePort chỉ bind trên Tailscale interface (100.x.x.x)
#   3. Argo CD login — username/password
#
# Truy cập:
#   http://100.94.203.28:30080    (worker node qua Tailscale)
#   http://100.95.126.102:30080   (master node qua Tailscale)
#
# Apply:
#   kubectl apply -f nodeport-tailscale.yaml
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-tailscale
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/component: server-tailscale
    app.kubernetes.io/part-of: platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080      # Fixed port — dễ nhớ
      protocol: TCP
