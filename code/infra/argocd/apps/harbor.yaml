# Harbor — Self-hosted OCI Registry
# Managed by Argo CD (App-of-Apps pattern)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: harbor
    repoURL: https://helm.goharbor.io
    targetRevision: "1.16.2"
    helm:
      releaseName: harbor
      valuesObject:
        expose:
          type: clusterIP
          tls:
            auto:
              commonName: harbor.kythuat.vn
        externalURL: https://harbor.kythuat.vn
        persistence:
          persistentVolumeClaim:
            registry:
              size: 10Gi
            database:
              size: 2Gi
        trivy:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
