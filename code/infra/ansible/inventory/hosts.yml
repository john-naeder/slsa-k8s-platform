---
# =============================================================================
# Kubernetes Cluster Inventory
#
# Sử dụng Tailscale IP để SSH vào các node.
# Thêm node mới bằng cách thêm entry vào group masters/workers
# và tạo file host_vars/<hostname>.yml tương ứng.
# =============================================================================

all:
  children:
    masters:
      hosts:
        userver-master:
          ansible_host: 100.95.126.102
    workers:
      hosts:
        userver-home-worker:
          ansible_host: 100.94.203.28
        # --- Thêm worker mới tại đây ---
        # userver-worker-2:
        #   ansible_host: <tailscale-ip>

    # Group gộp tất cả K8s nodes
    k8s_cluster:
      children:
        masters:
        workers:
