apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-worker
  namespace: demo
  labels:
    app: demo-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-worker
  template:
    metadata:
      labels:
        app: demo-worker
    spec:
      containers:
        - name: demo-worker
          # Placeholder — will be updated by Tekton promote task with sha256 digest
          image: harbor.kythuat.vn/demo/demo-worker:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: APP_VERSION
              value: "0.1.0"
            - name: KAFKA_BROKERS
              value: "demo-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_TOPIC
              value: "demo-events"
            - name: KAFKA_GROUP_ID
              value: "demo-worker"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
