# =============================================================================
# Kyverno ClusterPolicy — Verify SLSA Provenance Attestation
# =============================================================================
#
# Ensures that all container images from Harbor have a valid SLSA v0.2
# provenance attestation signed with our Cosign key. This proves:
#   1. The image was built by Tekton (builder.id = tekton.dev/chains/v2)
#   2. The build was not tampered with
#   3. The complete build metadata is available
#
# Apply:
#   kubectl apply -f verify-slsa-provenance.yaml
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-slsa-provenance
  annotations:
    policies.kyverno.io/title: Verify SLSA Provenance Attestation
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Enforce that all Harbor images have a valid SLSA v0.2 provenance
      attestation, proving they were built by our Tekton pipeline.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-slsa-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - demo
      verifyImages:
        - imageReferences:
            - "harbor.kythuat.vn/demo/*"
          attestations:
            - type: https://slsa.dev/provenance/v0.2
              attestors:
                - count: 1
                  entries:
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFL4Fi8Y3AuJE/fUcC84FlYjhb9Ln
                          g21CxmaHapq7SweqpXVI7hI+HeCzI5aRuGkm4qYw3nU58FgFrDj5pQTQfg==
                          -----END PUBLIC KEY-----
              conditions:
                - all:
                    # Verify the build was done by Tekton Chains
                    - key: "{{ invocation.configSource.uri || builder.id }}"
                      operator: AnyIn
                      value:
                        - "https://tekton.dev/chains/v2"
